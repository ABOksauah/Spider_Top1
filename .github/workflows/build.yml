name: Build Spider APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Spider_Top1_REPAIRED.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Source
        run: unzip -o Spider_Top1_REPAIRED.zip -d .

      - name: Build APK
        working-directory: Spider_Top1_BUILDABLE
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spider-Top1-APK
          path: Spider_Top1_BUILDABLE/app/build/outputs/apk/debug/*.apk
